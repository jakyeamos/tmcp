name: Verify

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: read

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install quality tools
        run: python -m pip install --disable-pip-version-check ruff==0.15.10 basedpyright==1.39.0
      - name: Formatting
        run: ruff format --check scripts tmcp_runtime tests
      - name: Ruff lint
        run: ruff check scripts tmcp_runtime tests
      - name: Typecheck
        run: basedpyright

  verify:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.13"
    env:
      TMCP_HOME: ${{ github.workspace }}/.tmcp-home

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile
        run: python scripts/release_package_compile.py
      - name: Launcher syntax
        run: node --check scripts/tmcp_launcher.mjs
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Public contracts
        run: python scripts/check_contracts.py .
      - name: Install shape
        run: python scripts/check_install.py .
      - name: Release package
        run: python scripts/check_release_package.py . --verify-reproducible
      - name: Active release evidence
        run: python scripts/check_release_evidence.py .
