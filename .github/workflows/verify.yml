name: Verify

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.13"
    env:
      TMCP_HOME: ${{ github.workspace }}/.tmcp-home

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile
        run: python -m py_compile scripts/tmcp_mcp_server.py scripts/check_contracts.py scripts/check_install.py scripts/check_release_package.py scripts/release_package_composition.py scripts/release_package_sessions.py scripts/release_package_compile.py scripts/tmcp_release_archive.py scripts/check_release_evidence.py scripts/pre_cr_coverage.py scripts/tmcp_mcp_framing.py scripts/tmcp_redaction.py scripts/tmcp_skill_evaluate.py tmcp_runtime/__init__.py tmcp_runtime/api/__init__.py tmcp_runtime/api/registry.py tmcp_runtime/api/tool_schemas.py tmcp_runtime/domain/__init__.py tmcp_runtime/domain/declared_loads.py tmcp_runtime/domain/composition.py tmcp_runtime/domain/families.py tmcp_runtime/domain/harvest_labels.py tmcp_runtime/domain/harvest_nodes.py tmcp_runtime/domain/packets.py tmcp_runtime/domain/recompile.py tmcp_runtime/domain/review_evidence.py tmcp_runtime/domain/review_profiles.py tmcp_runtime/domain/review_results.py tmcp_runtime/domain/runtime_state.py tmcp_runtime/domain/routes.py tmcp_runtime/domain/standalone_packets.py tmcp_runtime/domain/workflow_activation.py tmcp_runtime/domain/workflow_adaptive.py tmcp_runtime/domain/workflow_catalog.py tmcp_runtime/domain/workflow_promotion.py tmcp_runtime/domain/workflow_recommendations.py tmcp_runtime/safety/__init__.py tmcp_runtime/safety/files.py tmcp_runtime/safety/fixed_files.py tmcp_runtime/storage/__init__.py tmcp_runtime/storage/artifacts.py tmcp_runtime/storage/cache_policy.py tmcp_runtime/storage/sessions.py tmcp_runtime/services/__init__.py tmcp_runtime/services/compose.py tmcp_runtime/services/harvest.py tmcp_runtime/services/promotion.py tmcp_runtime/services/recompile.py tmcp_runtime/services/recommendations.py tmcp_runtime/services/review.py
      - name: Launcher syntax
        run: node --check scripts/tmcp_launcher.mjs
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Public contracts
        run: python scripts/check_contracts.py .
      - name: Install shape
        run: python scripts/check_install.py .
      - name: Release package
        run: python scripts/check_release_package.py . --verify-reproducible
      - name: Active release evidence
        run: python scripts/check_release_evidence.py .
