name: Verify

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.13"
    env:
      TMCP_HOME: ${{ runner.temp }}/tmcp-home

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile
        run: python -m py_compile scripts/tmcp_mcp_server.py scripts/check_install.py scripts/check_release_package.py scripts/tmcp_release_archive.py scripts/check_release_evidence.py scripts/pre_cr_coverage.py scripts/tmcp_mcp_framing.py scripts/tmcp_redaction.py scripts/tmcp_route_catalog.py scripts/tmcp_skill_evaluate.py
      - name: Launcher syntax
        run: node --check scripts/tmcp_launcher.mjs
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Install shape
        run: python scripts/check_install.py .
      - name: Release package
        run: python scripts/check_release_package.py . --verify-reproducible
      - name: Active release evidence
        run: python scripts/check_release_evidence.py .
